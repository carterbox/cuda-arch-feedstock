cuda_arch_version:
  - 5.0
  - 5.2
  - 5.3
  - 6.0
  - 6.1
  - 6.2
  - 7.0
  - 7.2
  - 7.5
  - 8.0
  - 8.6
  - 8.7
  - 8.9
  - 9.0
  - 10.0
  - 10.1 # For CTK 12; becomes 11.0 in CTK 13
  - 10.3
  - 11.0
  - 12.0
  - 12.1

cuda_compiler_version:
  - 12
  - 13

# The cuda_arch ranges for CUDA major versions 12 and 13 only overlap for one arch: 7.5. We
# have two variants of this package: one as the min arch of CUDA 13 which doesn't require
# __cuda_arch and the other as a normal arch of CUDA 12 which does require __cuda_arch. We
# don't need to build archs >= 8.0 twice because the requirements will be identical for
# either CUDA major version.

cuda_arch_version_min:
  - 5.0
  - 7.5

cuda_arch_version_max:
  - 7.5
  - 99.9

zip_keys:
  - - cuda_compiler_version
    - cuda_arch_version_min
    - cuda_arch_version_max
